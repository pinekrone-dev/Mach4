# Publishes SitePlanner to the `missfits` Cloudflare Worker.
#
# It is an assets-only Worker (see wrangler.toml) — no server code, the static
# site is served straight from the edge.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   account-owned token, Workers Scripts:Edit
#   CLOUDFLARE_ACCOUNT_ID  the 32-hex account id

name: Deploy

on:
  push:
    branches: [main, claude/charming-mayer-iljhu7]
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the test suite
        run: node tools/smoke.mjs

      - name: Stage the site
        run: ./stage.sh

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # A bare 200 proves nothing, so check status and content type per path.
      - name: Verify the deployment
        run: |
          sleep 20
          base="https://missfits.shiny-butterfly-2b90.workers.dev"
          fail=0
          check() {
            read -r code type < <(curl -s -o /dev/null \
              -w '%{http_code} %{content_type}' --max-time 20 "$base$1")
            echo "$1 -> $code $type"
            case "$type" in $3) ;; *) echo "   unexpected type"; fail=1 ;; esac
            [ "$code" = "$2" ] || { echo "   expected $2"; fail=1; }
          }
          check /                 200 'text/html*'
          check /src/main.js      200 '*javascript*'
          check /styles.css       200 'text/css*'
          check /no-such-page     404 '*'
          exit $fail
